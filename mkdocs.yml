site_name: 他山团队 Claude Code 研究工作流
site_description: 用 AI 助手重塑学术研究流程，从文献综述到论文发表
site_author: 他山团队 (Tashan)
copyright: Copyright &copy; 2026 他山团队 (Tashan)

# 站点配置
site_url: https://tashangkd.github.io/cc_plugins/

# 仓库配置
repo_url: https://github.com/TashanGKD/cc_plugins
repo_name: TashanGKD/cc_plugins

# 主题配置
theme:
  name: material
  language: zh
  palette:
    # 自动切换亮/暗模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  features:
    # 导航功能
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.prune
    # 搜索功能
    - search.suggest
    - search.highlight
    - search.share
    # 内容功能
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    # 目录功能
    - toc.follow
    # 其他功能
    - announce.dismiss
  # 字体配置
  font:
    text: Roboto
    code: Roboto Mono
  # 图标配置
  icon:
    logo: material/book-open-variant
    repo: fontawesome/brands/github
    previous: fontawesome/solid/arrow-left
    next: fontawesome/solid/arrow-right
  # 内容宽度
  content:
    width: 900px

# 插件
plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s\-\.]+'
  - git-revision-date-localized:
      type: datetime
      timezone: Asia/Shanghai
      locale: zh
      enable_creation_date: true

# Markdown 扩展
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

  # PyMdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

  # 其他
  - tables

# 额外 CSS
extra_css:
  - stylesheets/extra.css
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css

# 额外 JS
extra_javascript:
  - javascripts/katex.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js

# 额外配置
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TashanGKD/cc_plugins
    - icon: fontawesome/solid/envelope
      link: mailto:qingyuge@foxmail.com
  analytics:
    feedback:
      title: 这份文档对您有帮助吗？
      ratings:
        - icon: material/emoticon-happy-outline
          name: 有帮助
          data: 1
          note: 感谢您的反馈！
        - icon: material/emoticon-neutral-outline
          name: 还可以
          data: 2
          note: 感谢您的反馈！
        - icon: material/emoticon-sad-outline
          name: 需要改进
          data: 3
          note: 感谢您的反馈！我们会继续改进。

# 导航结构
nav:
  - 首页: index.md
  - 快速开始:
      - Claude Code 环境搭建: tutorial/01-basics/01-getting-started.md
      - Claude Code 基础教程: tutorial/01-basics/02-basic-usage.md
  - 插件文档:
      - 插件概览: plugins/index.md
      - Scispark: plugins/scispark.md
      - Manim Creator: plugins/manim-creator.md
  - 开发指南:
      - 开发总览: development/index.md
      - 贡献指南: development/contributing.md
