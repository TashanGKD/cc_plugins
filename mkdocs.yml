site_name: 他山团队 Claude Code 插件集合
site_description: 为学术研究提供专业的工作流支持
site_author: 他山团队 (Tashan)

# 站点配置
site_url: https://tashangkd.github.io/cc_plugins/
# 仓库配置
repo_url: https://github.com/TashanGKD/cc_plugins
repo_name: TashanGKD/cc_plugins

# 版权信息
copyright: Copyright &copy; 2026 他山团队 (Tashan)

# 主题配置
theme:
  name: material
  language: zh
  palette:
    # 自动切换亮/暗模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  features:
    # 导航功能
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.prune
    # 搜索功能
    - search.suggest
    - search.highlight
    - search.share
    # 内容功能
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    # 目录功能
    - toc.integrate
    - toc.follow
    # 其他
    - announce.dismiss
  # 布局配置
  font:
    text: Roboto
    code: Roboto Mono
  # 内容与图标配置
  favicon: assets/favicon.png
  logo: assets/logo.png
  icon:
    logo: material/book-open-variant
    repo: fontawesome/brands/github
  # 内容宽度配置
  content:
    width: 900px

# 插件
plugins:
  - search:
      lang:
        - zh
        - en
  - git-revision-date-localized:
      enable_creation_date: true

# Markdown 扩展
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

# 额外 CSS
extra_css:
  - stylesheets/extra.css

# 额外 JS
extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6,Array.prototype.includes,Promise,Object.assign,Object.entries
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# 导航结构
nav:
  - 首页: index.md
  - 快速开始:
      - Claude Code 环境搭建: tutorial/01-basics/01-getting-started.md
      - Claude Code 基础教程: tutorial/01-basics/02-basic-usage.md
  - 插件文档:
      - 插件概览: plugins/index.md
      - Scispark: plugins/scispark.md
      - Manim Creator: plugins/manim-creator.md
  - 开发指南:
      - 开发总览: development/index.md
      - 贡献指南: development/contributing.md
